# Include these locations in the same TLS server block that currently proxies
# /api/v1/ to the THETA Business API. TLS remains terminated by Nginx.
location = /agent-healthz {
    proxy_set_header Host $host;
    proxy_pass http://theta_agent_api/healthz;
}

location = /agent-readyz {
    proxy_set_header Host $host;
    proxy_pass http://theta_agent_api/readyz;
}

location /api/v1/agent/ {
    client_max_body_size 200m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-CSRF-Token $http_x_csrf_token;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    add_header X-Accel-Buffering no always;
    proxy_pass http://theta_agent_api;
}
