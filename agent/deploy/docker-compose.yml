services:
  agent-api:
    build:
      context: ../..
      dockerfile: agent/Dockerfile
    image: theta-agent-api:local
    restart: unless-stopped
    init: true
    environment:
      THETA_AGENT_SERVICE_MODE: ${THETA_AGENT_SERVICE_MODE:-local}
      THETA_AGENT_API_HOST: 0.0.0.0
      THETA_AGENT_API_PORT: 4318
      THETA_AGENT_HOME: /data
      THETA_PROJECT_ROOT: /app
      THETA_AGENT_ALLOWED_ORIGINS: ${THETA_AGENT_ALLOWED_ORIGINS:-http://localhost:8088}
      THETA_AGENT_TRUSTED_HOSTS: ${THETA_AGENT_TRUSTED_HOSTS:-localhost,127.0.0.1}
      THETA_AGENT_HEALTH_HOST: ${THETA_AGENT_HEALTH_HOST:-localhost}
      THETA_BUSINESS_API_URL: ${THETA_BUSINESS_API_URL:-}
      THETA_BUSINESS_IDENTIFIER: ${THETA_BUSINESS_IDENTIFIER:-}
      THETA_BUSINESS_PASSWORD: ${THETA_BUSINESS_PASSWORD:-}
      THETA_BUSINESS_BINDINGS: /run/secrets/business-bindings.json
      THETA_INFERENCE_PROVIDER: ${THETA_INFERENCE_PROVIDER:-}
      THETA_INFERENCE_API_KEY: ${THETA_INFERENCE_API_KEY:-}
      THETA_INFERENCE_BASE_URL: ${THETA_INFERENCE_BASE_URL:-}
      THETA_INFERENCE_MODEL: ${THETA_INFERENCE_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_API_BASE: ${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
    volumes:
      - agent-data:/data
      - type: bind
        source: ${THETA_BUSINESS_BINDINGS_HOST:-./empty-bindings.json}
        target: /run/secrets/business-bindings.json
        read_only: true
    expose:
      - "4318"
    networks: [theta-agent]
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      agent-api:
        condition: service_healthy
    ports:
      - "${THETA_AGENT_HTTP_PORT:-8088}:8080"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [theta-agent]
    security_opt:
      - no-new-privileges:true

networks:
  theta-agent:
    driver: bridge

volumes:
  agent-data:
