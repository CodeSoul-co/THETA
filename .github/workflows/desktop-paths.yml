name: Native desktop paths
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix desktop ci
      - run: node desktop/scripts/check-native-paths.cjs
